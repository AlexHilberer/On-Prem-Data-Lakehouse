version: 1
metadata:
  name: Lakehouse machine identities
entries:
  - model: authentik_core.group
    id: group-pipeline
    identifiers:
      name: lakehouse_pipeline
  - model: authentik_core.user
    id: user-pipeline
    identifiers:
      username: svc_pipeline
    attrs:
      name: Lakehouse pipeline service
      type: service_account
      path: goauthentik.io/service-accounts
      groups:
        - !KeyOf group-pipeline
  - model: authentik_core.token
    identifiers:
      identifier: lakehouse-pipeline-app-password
    attrs:
      user: !KeyOf user-pipeline
      intent: app_password
      key: !Env SVC_PIPELINE_TOKEN
      expiring: false
  - model: authentik_core.group
    id: group-trino
    identifiers:
      name: lakehouse_trino
  - model: authentik_core.user
    id: user-trino
    identifiers:
      username: svc_trino
    attrs:
      name: Lakehouse trino service
      type: service_account
      path: goauthentik.io/service-accounts
      groups:
        - !KeyOf group-trino
  - model: authentik_core.token
    identifiers:
      identifier: lakehouse-trino-app-password
    attrs:
      user: !KeyOf user-trino
      intent: app_password
      key: !Env SVC_TRINO_TOKEN
      expiring: false
  - model: authentik_core.group
    id: group-polaris-admin
    identifiers:
      name: lakehouse_service_admin
  - model: authentik_core.user
    id: user-polaris-admin
    identifiers:
      username: svc_polaris_admin
    attrs:
      name: Lakehouse polaris-admin service
      type: service_account
      path: goauthentik.io/service-accounts
      groups:
        - !KeyOf group-polaris-admin
  - model: authentik_core.token
    identifiers:
      identifier: lakehouse-polaris-admin-app-password
    attrs:
      user: !KeyOf user-polaris-admin
      intent: app_password
      key: !Env SVC_POLARIS_ADMIN_TOKEN
      expiring: false
