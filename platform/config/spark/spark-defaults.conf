# Default system properties included when running spark-submit.
# This is useful for setting default environmental settings.

# Example:
# spark.master                     spark://master:7077
# spark.eventLog.enabled           true
# spark.eventLog.dir               hdfs://namenode:8021/directory
# spark.serializer                 org.apache.spark.serializer.KryoSerializer
# spark.driver.memory              5g
# spark.executor.extraJavaOptions  -XX:+PrintGCDetails -Dkey=value -Dnumbers="one two three"

# Lakehouse deployment settings.
spark.master                                      spark://spark-master:7077
spark.submit.deployMode                           client
spark.driver.memory                               512m
spark.executor.memory                             1024m
spark.executor.cores                              2
spark.cores.max                                   2
spark.serializer                                  org.apache.spark.serializer.KryoSerializer
spark.sql.extensions                              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse                       org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                  rest
spark.sql.catalog.lakehouse.uri                   http://polaris:8181/api/catalog
spark.sql.catalog.lakehouse.warehouse             lakehouse
spark.sql.catalog.lakehouse.rest.auth.type        oauth2
spark.sql.catalog.lakehouse.oauth2-server-uri     https://authentik.lakehouse.local/application/o/token/
spark.sql.catalog.lakehouse.scope                 openid profile
spark.redaction.regex                             (?i)secret|password|token|access[.]?key|credential
spark.sql.catalog.lakehouse.client.region         garage
spark.sql.catalog.lakehouse.io-impl               org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.chunked-encoding-enabled false
spark.sql.catalog.lakehouse.s3.checksum-enabled   false
spark.driver.extraJavaOptions                     -Daws.requestChecksumCalculation=WHEN_REQUIRED -Daws.responseChecksumValidation=WHEN_REQUIRED -Djavax.net.ssl.trustStore=/opt/airflow/certs/lakehouse-truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit
spark.executor.extraJavaOptions                   -Daws.requestChecksumCalculation=WHEN_REQUIRED -Daws.responseChecksumValidation=WHEN_REQUIRED
spark.sql.defaultCatalog                          lakehouse
spark.sql.session.timeZone                        UTC
spark.eventLog.enabled                            false
spark.ui.reverseProxy                             true
spark.ui.reverseProxyUrl                          http://127.0.0.1:8081
