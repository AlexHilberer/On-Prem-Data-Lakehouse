coordinator=true
node-scheduler.include-coordinator=true
http-server.http.enabled=false
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/run/certs/trino.pem
http-server.authentication.type=PASSWORD
http-server.process-forwarded=true
discovery.uri=https://127.0.0.1:8443
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
internal-communication.https.required=true
internal-communication.https.keystore.path=/run/certs/trino.pem
internal-communication.https.truststore.path=/run/certs/ca.crt
query.max-memory=768MB
query.max-memory-per-node=512MB
memory.heap-headroom-per-node=256MB
