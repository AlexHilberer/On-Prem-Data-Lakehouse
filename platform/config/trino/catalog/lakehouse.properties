connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lakehouse
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=lakehouse:${ENV:OIDC_TRINO_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.server-uri=https://authentik.lakehouse.local/application/o/token/
iceberg.rest-catalog.oauth2.scope=openid profile
fs.native-s3.enabled=true
s3.endpoint=http://garage:3900
s3.region=garage
s3.path-style-access=true
s3.aws-access-key=${ENV:GARAGE_ACCESS_KEY}
s3.aws-secret-key=${ENV:GARAGE_SECRET_KEY}

