# Stable Polaris settings; credentials and container wiring remain in Compose.
polaris.realm-context.realms=POLARIS
polaris.realm=POLARIS
polaris.persistence.type=relational-jdbc

# The authentication type comes from auth-external.properties or auth-mixed.properties (see Compose).
quarkus.oidc.tenant-enabled=true
quarkus.oidc.auth-server-url=https://authentik.lakehouse.local/application/o/lakehouse/
quarkus.oidc.client-id=lakehouse
quarkus.oidc.connection-delay=PT120S
quarkus.oidc.roles.role-claim-path=groups
polaris.oidc.principal-mapper.type=default
polaris.oidc.principal-mapper.name-claim-path=preferred_username
polaris.oidc.principal-roles-mapper.type=default
polaris.oidc.principal-roles-mapper.filter=lakehouse_.*
polaris.oidc.principal-roles-mapper.mappings[0].regex=lakehouse_(.*)
polaris.oidc.principal-roles-mapper.mappings[0].replacement=PRINCIPAL_ROLE:$1
