name: Validate infrastructure

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          python -m pip install --requirement control-panel/requirements.txt

      - name: Generate disposable local configuration
        run: ./lakehouse.sh init

      - name: Run static validation
        run: ./tests/static.sh
